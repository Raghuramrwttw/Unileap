# Nginx site for UniLeap. __DOMAIN__ is replaced by setup_server.sh.
# Certbot adds the HTTPS (443) block and the http->https redirect automatically.
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 20M;   # image uploads from the admin panels

    location /static/ {
        alias /home/unileap/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /home/unileap/app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
